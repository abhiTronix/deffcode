name: GitHub Action workflow for Linux

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.html"
      - "**/*.js"
      - "**/*.css"
      - "docs/**/*"
      - README.md
      - mkdocs.yml
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**/*"


jobs:
  test:
    name: CI Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install APT Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq unzip curl -y
          sudo apt-get install -qq dos2unix git -y
          sudo apt-get install ffmpeg v4l2loopback-dkms v4l2loopback-utils linux-modules-extra-$(uname -r) -y
      - name: Prepare Bash scripts
        run: |
          dos2unix scripts/bash/prepare_dataset.sh
          chmod +x scripts/bash/prepare_dataset.sh
      - name: Install Pip Dependencies
        run: |
          python -m pip install -U pip wheel numpy cython
          python -m pip install -U .
          python -m pip install -U opencv-python-headless 
          python -m pip install -U vidgear[core]
          python -m pip install -U ruff six codecov pytest pytest-cov
        if: success()
      - name: Run prepare_dataset Bash script
        run: bash scripts/bash/prepare_dataset.sh
        shell: bash
      - name: Run pytest and ruff
        run: |
          timeout 1200 python -m pytest -sv --cov=deffcode --cov-report=xml --cov-report term-missing tests/ || code=$?; if [[ $code -ne 124 && $code -ne 0 ]]; then exit $code; else echo "EXIT_CODE=$code" >>$GITHUB_ENV; fi
          ruff check .
          ruff format --check .
        if: success()
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          name: ${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
        if: ${{ env.EXIT_CODE != '124' }}